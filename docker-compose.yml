services:
  postgres:
    image: postgres:16
    container_name: fortune-cookie-db
    environment:
      POSTGRES_DB: fortunecookie
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
